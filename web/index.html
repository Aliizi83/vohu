<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vohu Platform</title>
    <script>
      // Applies the .dark class before the page paints, synchronously —
      // ThemeProvider (src/lib/theme.tsx) does the same detection on
      // mount, but by then the browser has already painted once; without
      // this, that first paint is always light, then flips to dark a
      // moment later.
      (function () {
        var stored = localStorage.getItem("vohu.theme")
        var dark =
          stored === "dark" ||
          (stored !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches)
        if (dark) document.documentElement.classList.add("dark")
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
