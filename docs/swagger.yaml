        1 is the most recent; higher page numbers reach further into the past) — for
        scroll-up-to-load-older-history. 404s for a conversation the caller doesn't
        own.
      parameters:
      - description: Conversation ID
        in: path
        name: id
        required: true
        type: integer
      - description: Page number, default 1 (most recent)
        in: query
        name: pageNumber
        type: integer
      - description: Page size, default 10
        in: query
        name: pageSize
        type: integer
