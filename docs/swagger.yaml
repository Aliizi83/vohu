info:
  contact: {}
  description: HTTP API for Vohu's multi-user platform — users, roles, polymorphic
    resource access, SSH connections, conversations/chat, provider keys, custom models,
    and the agent tool catalog. Every endpoint responds through shared.BaseResponse
    (see internal/platform/shared/response.go) — {result, success, resultCode, validationErrors,
    error} — regardless of success or failure.
  title: Vohu Platform API
  version: "1.0"
paths:
  /agent-tools:
    get:
      description: Lists every public tool plus any private tool the caller holds
        at least "read" access to. Every tool in this catalog is SSH-connection-bound
        — its Go implementation always takes a connectionId argument and checks the
        caller's access to that specific connection separately, on every call.
      parameters:
      - description: Page number, default 1
        in: query
        name: pageNumber
        type: integer
      - description: Page size, default 10
        in: query
        name: pageSize
        type: integer
      - description: JSON-encoded shared.DynamicFilter
        in: query
        name: filter
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_Aliizi83_vohu_internal_platform_shared.BaseResponse'
            - properties:
                result:
                  $ref: '#/definitions/github_com_Aliizi83_vohu_internal_platform_shared.PagedList-internal_platform_agenttool_Response'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_Aliizi83_vohu_internal_platform_shared.BaseResponse'
      security:
      - BearerAuth: []
      summary: List agent tools
      tags:
      - agent-tools
  /agent-tools/{id}:
    get:
      description: Returns one catalog entry by ID. Requires at least "read" access
        to this specific tool.
      parameters:
      - description: Tool ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_Aliizi83_vohu_internal_platform_shared.BaseResponse'
            - properties:
                result:
                  $ref: '#/definitions/internal_platform_agenttool.Response'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_Aliizi83_vohu_internal_platform_shared.BaseResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_Aliizi83_vohu_internal_platform_shared.BaseResponse'
      security:
      - BearerAuth: []
      summary: Get an agent tool
      tags:
      - agent-tools
    put:
      consumes:
      - application/json
      description: Changes a tool between public (available to everyone) and private
        (only whoever's been granted access). This is the only field the catalog lets
        an admin change — name/description/implemented are facts about the underlying
        Go implementation, not data this API owns. Requires "manage" access to this
        specific tool.
      parameters:
      - description: Tool ID
        in: path
        name: id
        required: true
        type: integer
      - description: New visibility
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_platform_agenttool.UpdateToolRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_Aliizi83_vohu_internal_platform_shared.BaseResponse'
            - properties:
                result:
                  $ref: '#/definitions/internal_platform_agenttool.Response'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_Aliizi83_vohu_internal_platform_shared.BaseResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_Aliizi83_vohu_internal_platform_shared.BaseResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_Aliizi83_vohu_internal_platform_shared.BaseResponse'
      security:
      - BearerAuth: []
      summary: Update an agent tool's visibility
      tags:
      - agent-tools
  /auth/login:
    post:
      consumes:
      - application/json
      description: Exchanges a username and password for an access/refresh token pair.
        No auth required — this is the entry point that produces tokens.
      parameters:
      - description: Credentials
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_platform_auth.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_Aliizi83_vohu_internal_platform_shared.BaseResponse'
            - properties:
                result:
                  $ref: '#/definitions/internal_platform_auth.TokenResponse'
              type: object
        "400":
          description: Missing username or password
          schema:
            $ref: '#/definitions/github_com_Aliizi83_vohu_internal_platform_shared.BaseResponse'
        "401":
          description: Invalid username or password
          schema:
            $ref: '#/definitions/github_com_Aliizi83_vohu_internal_platform_shared.BaseResponse'
      summary: Log in
      tags:
      - auth
  /auth/refresh:
    post:
      consumes:
      - application/json
      description: Exchanges a valid refresh token for a new access/refresh token
        pair. No auth header required — the refresh token in the body is the credential.
      parameters:
      - description: Refresh token
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_platform_auth.RefreshRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_Aliizi83_vohu_internal_platform_shared.BaseResponse'
            - properties:
                result:
                  $ref: '#/definitions/internal_platform_auth.TokenResponse'
              type: object
        "400":
          description: Missing refresh token
          schema:
            $ref: '#/definitions/github_com_Aliizi83_vohu_internal_platform_shared.BaseResponse'
        "401":
          description: Invalid or expired refresh token
          schema:
            $ref: '#/definitions/github_com_Aliizi83_vohu_internal_platform_shared.BaseResponse'
      summary: Refresh a token pair
      tags:
      - auth
  /command-rules:
    get:
      description: Lists every command rule for one SSH connection. The caller must
        hold "manage" on that connection.
      parameters:
      - description: SSH connection ID
        in: query
        name: sshConnectionId
        required: true
        type: integer
      - description: Page number, default 1
        in: query
        name: pageNumber
        type: integer
      - description: Page size, default 10
        in: query
        name: pageSize
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_Aliizi83_vohu_internal_platform_shared.BaseResponse'
            - properties:
                result:
                  $ref: '#/definitions/github_com_Aliizi83_vohu_internal_platform_shared.PagedList-internal_platform_commandrule_Response'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_Aliizi83_vohu_internal_platform_shared.BaseResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_Aliizi83_vohu_internal_platform_shared.BaseResponse'
        "403":
          description: Caller doesn't hold manage on the target connection
          schema:
            $ref: '#/definitions/github_com_Aliizi83_vohu_internal_platform_shared.BaseResponse'
      security:
      - BearerAuth: []
      summary: List an SSH connection's command rules
      tags:
      - command-rules
    post:
      consumes:
      - application/json
      description: Adds one allow/deny rule to an SSH connection's command policy.
        Rules are first-match-wins within a connection (evaluated in creation order)
        — a connection with no rules permits nothing. The caller must already hold
        "manage" on the target connection, same level required to delete it.
      parameters:
      - description: New rule
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_platform_commandrule.CreateRuleRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/github_com_Aliizi83_vohu_internal_platform_shared.BaseResponse'
            - properties:
                result:
                  $ref: '#/definitions/internal_platform_commandrule.Response'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_Aliizi83_vohu_internal_platform_shared.BaseResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_Aliizi83_vohu_internal_platform_shared.BaseResponse'
        "403":
          description: Caller doesn't hold manage on the target connection
          schema:
            $ref: '#/definitions/github_com_Aliizi83_vohu_internal_platform_shared.BaseResponse'
      security:
      - BearerAuth: []
      summary: Create a command rule
      tags:
      - command-rules
  /command-rules/{id}:
    delete:
      description: Removes one rule from an SSH connection's command policy. The caller
