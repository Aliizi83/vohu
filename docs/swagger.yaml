      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_Aliizi83_vohu_internal_platform_shared.BaseResponse'
            - properties:
                result:
                  $ref: '#/definitions/github_com_Aliizi83_vohu_internal_platform_shared.PagedList-internal_platform_chat_MessageResponse'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_Aliizi83_vohu_internal_platform_shared.BaseResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_Aliizi83_vohu_internal_platform_shared.BaseResponse'
      security:
      - BearerAuth: []
      summary: List a conversation's messages
      tags:
      - chat
    post:
      consumes:
      - application/json
      description: 'Sends a message and streams the reply as a Server-Sent Events
        response (Content-Type: text/event-stream) — this is NOT a plain JSON endpoint
        despite the shared.BaseResponse envelope every other route uses; it''s documented
        here for completeness but tools like "Try it out" won''t render it usefully.
        Events, in order: zero or more "chunk" (data is a raw string — one piece of
        assistant text as it streams in), then either "done" (data is []MessageResponse
        — every message this turn produced: the assistant''s reply and any tool call/result
        pairs, already persisted) or "error" (data is a plain error string; nothing
        was persisted).'
      parameters:
      - description: Conversation ID
        in: path
        name: id
        required: true
        type: integer
      - description: Message content
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_platform_chat.SendMessageRequest'
      produces:
      - text/event-stream
      responses:
        "200":
          description: SSE stream — see description for event shapes
          schema:
            type: string
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_Aliizi83_vohu_internal_platform_shared.BaseResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_Aliizi83_vohu_internal_platform_shared.BaseResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_Aliizi83_vohu_internal_platform_shared.BaseResponse'
      security:
      - BearerAuth: []
      summary: Send a message (SSE stream)
      tags:
      - chat
