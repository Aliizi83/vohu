server:
  internalPort: 5005
  externalPort: 5005
  runMode: debug
  domain: localhost
  appName: vohu
logger:
  fileFolderPath: logs
  encoding: json
  level: debug
  logger: zap # ["zap" | "zero"]
  maxLogAge: 7 # days
  maxLogSize: 50 # megabytes
postgres:
  host: localhost
  port: 5432
  user: postgres
  password: postgres
  dbName: vohu_db
  sslMode: disable
  maxIdleConns: 15
  maxOpenConns: 100
  connMaxLifetime: 5
jwt:
  secret: "dev-only-change-me"
  refreshSecret: "dev-only-change-me-too"
  accessTokenExpireDuration: 15 # minutes
  refreshTokenExpireDuration: 10080 # minutes (7 days)
